name: Signed SDK release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm, cache-dependency-path: typescript/package-lock.json}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: npm ci && npm run build && npm test
        working-directory: typescript
      - run: pip install build && python -m build
        working-directory: python
      - run: tar -czf adverserial-confidential-sdk-${{ github.ref_name }}.tgz python/dist typescript/dist LICENSE README.md
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: adverserial-confidential-sdk-${{ github.ref_name }}.tgz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: adverserial-confidential-sdk-${{ github.ref_name }}.tgz
