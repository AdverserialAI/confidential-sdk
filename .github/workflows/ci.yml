name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: typescript}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AdverserialAI/attest-proxy
          path: attest-proxy
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: typescript/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          ATTEST_PROXY_DIR: ${{ github.workspace }}/attest-proxy
  python:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: python}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
  plugins:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: plugins}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: plugins/package-lock.json}
      - run: npm ci
      - run: npm run build
  gateway:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: gateway}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ../python -e .
      - run: python -m unittest discover -s tests -v
